<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Descargo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="mb-3">Registrar Descargo de Vacaciones</h3>
                <h5 class="text-muted mb-4">Empleado: {{ empleado.nombre }}</h5>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Fecha de Registro</label>
                        <input type="date" name="fecha_descargo" class="form-control" required value="{{ now }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><strong>Período al que corresponde descontar:</strong></label>
                        <select name="periodo" class="form-select" required>
                            {% for row in kardex %}
                            <option value="{{ row.periodo }}">Período {{ row.numero_periodo }} ({{ row.periodo }}) - Disponible aprox</option>
                            {% endfor %}
                        </select>
                        <div class="form-text">Elige explícitamente el período laboral al que se imputarán estos días.</div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fecha Inicio (Vacación)</label>
                            <input type="date" name="fecha_inicio" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fecha Fin (Vacación)</label>
                            <input type="date" name="fecha_fin" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Motivo / Observaciones</label>
                        <input type="text" name="motivo" class="form-control" placeholder="Ej. Vacaciones anuales correspondientes">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Responsable / Autoriza</label>
                        <input type="text" name="responsable" class="form-control" placeholder="Nombre del jefe o Talento Humano">
                    </div>
                    <button type="submit" class="btn btn-primary">Registrar Descargo</button>
                    <a href="{{ url_for('empleado', empleado_id=empleado.id) }}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
