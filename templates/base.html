<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kardex de Vacaciones</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#243447}
nav{background:#174a7c;color:white;padding:15px 30px;font-size:20px;font-weight:bold}
.container{max-width:1200px;margin:30px auto;padding:0 18px}
.card{background:white;border-radius:12px;padding:22px;margin-bottom:20px;box-shadow:0 2px 10px #0001}
.btn{display:inline-block;padding:10px 15px;border-radius:7px;text-decoration:none;border:0;cursor:pointer;background:#1769aa;color:white}
.btn.green{background:#2e7d32}.btn.red{background:#b3261e}.btn.gray{background:#667085}
table{width:100%;border-collapse:collapse;background:white}
th{background:#174a7c;color:white;padding:11px;text-align:left}
td{padding:10px;border-bottom:1px solid #ddd}
input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd3da;border-radius:6px}
label{font-weight:bold;display:block;margin:10px 0 5px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.stat{font-size:25px;font-weight:bold}.small{color:#667085}
.alert{padding:12px;background:#e8f5e9;border-radius:7px;margin-bottom:15px}
.badge{padding:5px 8px;border-radius:12px;background:#e8f5e9}
@media(max-width:800px){.grid{grid-template-columns:1fr}table{font-size:13px}}
</style>
</head>
<body>
<nav>Kardex de Vacaciones — Ecuador</nav>
<div class="container">
{% with messages=get_flashed_messages() %}
{% if messages %}{% for m in messages %}<div class="alert">{{m}}</div>{% endfor %}{% endif %}
{% endwith %}
{% block content %}{% endblock %}
</div>
</body>
</html>
