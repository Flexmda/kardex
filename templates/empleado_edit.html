<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Empleado - {{ empleado.nombre }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="mb-4">Editar Datos de Empleado</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Empresa</label>
                        <select name="empresa_id" class="form-select" required>
                            {% for emp in empresas %}
                            <option value="{{ emp.id }}" {% if emp.id == empleado.empresa_id %}selected{% endif %}>{{ emp.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" name="nombre" class="form-control" value="{{ empleado.nombre }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Cédula / Identificación</label>
                        <input type="text" name="cedula" class="form-control" value="{{ empleado.cedula or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Cargo</label>
                        <input type="text" name="cargo" class="form-control" value="{{ empleado.cargo or '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Fecha de Ingreso</label>
                        <input type="date" name="fecha_ingreso" class="form-control" value="{{ empleado.fecha_ingreso }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Fecha de Salida (Opcional)</label>
                        <input type="date" name="fecha_salida" class="form-control" value="{{ empleado.fecha_salida or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Observaciones</label>
                        <textarea name="observaciones" class="form-control" rows="2">{{ empleado.observaciones or '' }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    <a href="{{ url_for('empleado', empleado_id=empleado.id) }}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
